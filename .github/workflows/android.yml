name: Build Android App

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "No se encontró sdkmanager"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls -R /usr/local/lib/android/sdk 2>/dev/null || true
            exit 1
          fi

          echo "Usando sdkmanager: $SDKMANAGER"

          # Aceptar licencias sin romper el step por Broken pipe
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true

          # Instalar los paquetes necesarios para compileSdk 36
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Prepare build environment
        shell: bash
        run: |
          set -e

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logitpass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
