name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 36
          build-tools: 36.0.0
          components: |
            platform-tools
            platforms;android-36
            cmdline-tools;latest

      - name: Ensure Android SDK env and PATH
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/platform-tools"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          (yes | sdkmanager --licenses) || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare build environment (keystore & permissions)
        shell: bash
        run: |
          touch .env
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # If gradlew exists make it executable; if not, skip (we'll use Docker fallback)
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK (use gradlew if present, otherwise Docker image with Gradle)
        shell: bash
        run: |
          set -e
          echo "Working dir: $PWD"
          if [ -f ./gradlew ]; then
            echo "gradlew found in repo — using it."
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew not found — using Docker gradle image and mounting Android SDK"
            # Ensure GITHUB_WORKSPACE and ANDROID_SDK_ROOT are set
            if [ -z "${GITHUB_WORKSPACE:-}" ]; then
              echo "::error::GITHUB_WORKSPACE is not set"
              exit 1
            fi
            if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
              echo "::error::ANDROID_SDK_ROOT is not set"
              exit 1
            fi
            # Run Gradle inside Docker, mount workspace and Android SDK from the runner
            docker run --rm \
              -v "${GITHUB_WORKSPACE}":/home/gradle/project \
              -v "${ANDROID_SDK_ROOT}":"${ANDROID_SDK_ROOT}" \
              -w /home/gradle/project \
              --env ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
              --env GRADLE_USER_HOME=/home/gradle/.gradle \
              gradle:8.4-jdk17 \
              gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogitPass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
