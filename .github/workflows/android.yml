name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 36
          build-tools: 36.0.0
          components: |
            platform-tools
            platforms;android-36
            cmdline-tools;latest

      - name: Ensure Android SDK env and PATH
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/platform-tools"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          (yes | sdkmanager --licenses) || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare build environment (debug keystore & permissions)
        shell: bash
        run: |
          touch .env
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # keep executable if present at repo root
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK (use gradlew if present, otherwise Docker gradle 9.3.1)
        shell: bash
        run: |
          set -euo pipefail
          echo "Working dir: $PWD"
          # Prefer gradlew in repo root
          if [ -f ./gradlew ]; then
            echo "Using ./gradlew from repo root"
            ./gradlew assembleDebug --stacktrace --no-daemon
            exit $?
          fi

          # Try to find gradlew elsewhere in repo (maxdepth to avoid scanning too deep)
          GRADLEW_PATH=$(find . -maxdepth 6 -type f -name gradlew -print -quit || true)
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH"
            chmod +x "$GRADLEW_PATH"
            pushd "$(dirname "$GRADLEW_PATH")" >/dev/null
            ./gradlew assembleDebug --stacktrace --no-daemon
            popd >/dev/null
            exit $?
          fi

          # Fallback: use Docker image with Gradle >= 9.3.1 required by Android Gradle Plugin 9.1.1
          echo "gradlew not found — using Docker gradle:9.3.1-jdk17"
          WORKSPACE="${PWD}"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          echo "Workspace: $WORKSPACE"
          echo "ANDROID_SDK: $ANDROID_SDK"

          # Ensure Android SDK path exists on runner
          if [ ! -d "$ANDROID_SDK" ]; then
            echo "::error::Android SDK not found at $ANDROID_SDK"
            exit 1
          fi

          docker run --rm \
            -v "$WORKSPACE":/home/gradle/project \
            -v "$ANDROID_SDK":"$ANDROID_SDK" \
            -w /home/gradle/project \
            --env ANDROID_SDK_ROOT="$ANDROID_SDK" \
            --env GRADLE_USER_HOME=/home/gradle/.gradle \
            gradle:9.3.1-jdk17 \
            gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogitPass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
